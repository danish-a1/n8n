services:
  n8n:
    image: n8nio/n8n:local
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5678:5678" 
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - shared-services

volumes:
  n8n_data:

networks:
  shared-services:
    external: true
